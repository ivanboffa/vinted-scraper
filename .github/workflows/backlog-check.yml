name: Backlog Check

on:
  schedule:
    - cron: '0 3 * * *'   # ogni notte alle 03:00 UTC (backlog recovery)
  workflow_dispatch:

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backlog status check (oldest first)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          CONCURRENCY: "3"
          REQUEST_DELAY: "1.0"
          OLDEST_FIRST: "true"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py check
