name: Mid-Age Items Check

on:
  schedule:
    - cron: '15 * * * *'   # ogni ora (sfasato di 15min rispetto a check.yml)
  workflow_dispatch:

jobs:
  mid-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check mid-age items (48h – 7d)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          CONCURRENCY: "5"
          REQUEST_DELAY: "0.8"
          CHECK_LIMIT: "5000"
          MIN_AGE_HOURS: "48"
          OLDEST_FIRST: "true"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py check
