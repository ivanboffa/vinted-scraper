name: Scrape

on:
  # Scheduled runs are intentionally disabled: the project is archived and the
  # database it wrote to no longer exists. Kept dispatch-only for reference.
  workflow_dispatch:          # avvio manuale dalla UI GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          CONCURRENCY: "5"
          REQUEST_DELAY: "0.8"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py scrape
