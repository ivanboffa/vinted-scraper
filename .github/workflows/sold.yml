name: Sold Finder

on:
  # Scheduled runs are intentionally disabled: the project is archived and the
  # database it wrote to no longer exists. Kept dispatch-only for reference.
  workflow_dispatch:

jobs:
  sold:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # sold finder può richiedere più tempo

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sold finder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          CONCURRENCY: "3"
          REQUEST_DELAY: "1.0"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py sold
