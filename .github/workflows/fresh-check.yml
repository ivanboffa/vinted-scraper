name: Fresh Items Check

on:
  # Scheduled runs are intentionally disabled: the project is archived and the
  # database it wrote to no longer exists. Kept dispatch-only for reference.
  workflow_dispatch:

jobs:
  fresh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # articoli freschi sono pochi → finisce in < 15 min

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check fresh items (< 48h)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          CONCURRENCY: "5"
          REQUEST_DELAY: "0.8"
          CHECK_LIMIT: "2000"
          FRESH_ONLY: "true"
          FRESH_HOURS: "48"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py check
